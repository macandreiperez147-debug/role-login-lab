
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <h1>My Profile</h1>
      <p class="subtitle">Update your account information</p>

      <form id="profileForm">
        <label for="name">Full Name</label>
        <input id="name" required>

        <label for="email">Email Address</label>
        <input id="email" type="email" required>

        <h3>Change Password (optional)</h3>

        <label for="currentPassword">Current Password</label>
        <input id="currentPassword" type="password"
               autocomplete="current-password">

        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password"
               minlength="6" autocomplete="new-password">

        <button type="submit">Save Changes</button>
        <p id="message" class="message" role="status"></p>
      </form>

      <p class="auth-link"><a id="backLink" href="/user.html">Back to Dashboard</a></p>
    </section>
  </main>

  <script>
    const storedUser = sessionStorage.getItem('currentUser');

    if (!storedUser) {
      window.location.replace('/login.html');
    } else {
      const currentUser = JSON.parse(storedUser);
      const form = document.getElementById('profileForm');
      const message = document.getElementById('message');

      document.getElementById('name').value = currentUser.name;
      document.getElementById('email').value = currentUser.email;

      const dashboardByRole = {
        admin: '/admin.html',
        staff: '/staff.html',
        user: '/user.html'
      };

      document.getElementById('backLink').href =
        dashboardByRole[currentUser.role] || '/user.html';

      form.addEventListener('submit', async event => {
        event.preventDefault();
        message.className = 'message';
        message.textContent = 'Saving changes...';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const currentPassword =
          document.getElementById('currentPassword').value;
        const newPassword =
          document.getElementById('newPassword').value;

        if (newPassword && !currentPassword) {
          message.textContent =
            'Enter your current password to change your password.';
          message.classList.add('error');
          return;
        }

        const payload = { name, email };

        if (newPassword) {
          payload.currentPassword = currentPassword;
          payload.newPassword = newPassword;
        }

        try {
          const response = await fetch(`/api/profile/${currentUser.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            message.textContent = data.message || 'Update failed.';
            message.classList.add('error');
            return;
          }

          sessionStorage.setItem('currentUser', JSON.stringify(data.user));
          document.getElementById('currentPassword').value = '';
          document.getElementById('newPassword').value = '';

          message.textContent = 'Profile updated successfully.';
          message.classList.add('success');
        } catch {
          message.textContent = 'Cannot connect to the server.';
          message.classList.add('error');
        }
      });
    }
  </script>
</body>
</html>
